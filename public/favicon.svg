  <!-- Subtle Blueprint Grid Hairlines -->
  <line x1="28" y1="8" x2="28" y2="56" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="8" y1="36" x2="56" y2="36" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Swiss Bento Cell 1: Vertical Left Stem of "L" -->
